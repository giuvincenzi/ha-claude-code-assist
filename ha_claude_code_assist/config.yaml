name: HA Claude Code Assist
version: "0.1.0"
slug: ha_claude_code_assist
description: A personal assistant for your home in Home Assistant, running Claude Code on your own Claude subscription.
arch:
  - aarch64
  - amd64
# S6 overlay of the base image must run as PID 1.
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:creation-outline
panel_title: HA Claude Code Assist
# The panel updates the app's own options through the Supervisor API.
hassio_api: true
# Tells Home Assistant where the app is, so it offers to set up the integration for Assist.
discovery:
  - ha_claude_code_assist
options:
  claude_code_oauth_token: ""
  model: haiku
  effort: low
  web_search: false
  read_files: true
  mcp_servers: '{"mcpServers": {}}'
  session_timeout_minutes: 5
  session_retention_days: 30
  memory_enabled: true
  memory_max_entries: 100
  memory_max_entry_length: 500
schema:
  claude_code_oauth_token: password?
  model: list(haiku|sonnet|opus)
  effort: list(low|medium|high|xhigh|max)
  web_search: bool
  read_files: bool
  mcp_servers: str
  session_timeout_minutes: int(1,1440)
  session_retention_days: int(1,3650)
  memory_enabled: bool
  memory_max_entries: int(1,1000)
  memory_max_entry_length: int(50,5000)
